[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Telegram vacancy monitor and hh.ru auto-apply"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.10",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "playwright>=1.47",
    "aiohttp>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobpilot = "jobpilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobpilot.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
